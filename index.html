<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DriveRent – Premium Car & Bike Rental Marketplace</title>
    <meta name="description" content="Rent verified cars, luxury sedans, SUVs, and bikes from top local rental shops at best daily & weekly rates with DriveRent." />
    <meta name="theme-color" content="#2563eb" />
    <meta name="color-scheme" content="light dark" />

    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="canonical" href="https://driverent.in/" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="DriveRent" />
    <meta property="og:title" content="DriveRent | Premium Car & Bike Rental Marketplace" />
    <meta property="og:description" content="Discover and book cars & bikes from verified local rental shops with transparent pricing and instant booking." />
    <meta property="og:url" content="https://driverent.in/" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="DriveRent – Car & Bike Rentals" />
    <meta name="twitter:description" content="Rent verified cars, SUVs, and bikes from top rental shops with DriveRent." />

    <!-- Performance: Preconnect & DNS Prefetch to Cloudinary -->
    <link rel="preconnect" href="https://res.cloudinary.com" crossorigin />
    <link rel="dns-prefetch" href="https://res.cloudinary.com" />

    <!-- Critical Preload for Hero Background (Responsive WebP Optimized) -->
    <link rel="preload" as="image" href="/luxury-car-auth-mobile.webp" type="image/webp" media="(max-width: 640px)" fetchpriority="high" />
    <link rel="preload" as="image" href="/luxury-car-auth.webp" type="image/webp" media="(min-width: 641px)" fetchpriority="high" />

    <style>
      /* Critical Instant First-Paint Shell (< 50ms FCP) */
      #initial-shell {
        position: relative;
        min-height: 100vh;
        background: #0b0f19;
        color: #ffffff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        overflow: hidden;
      }
      .shell-header {
        height: 80px;
        background: #ffffff;
        border-bottom: 1px solid #e2e8f0;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 16px;
      }
      @media (min-width: 640px) {
        .shell-header { padding: 0 32px; }
      }
      .shell-logo {
        display: flex;
        align-items: center;
        gap: 10px;
        font-weight: 900;
        font-size: 24px;
        color: #0f172a;
        letter-spacing: -0.5px;
        text-transform: uppercase;
      }
      .shell-logo-badge {
        width: 40px;
        height: 40px;
        border-radius: 12px;
        background: #2563eb;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #ffffff;
      }
      .shell-hero {
        position: relative;
        padding: 24px 16px 80px;
        overflow: hidden;
      }
      .shell-hero-inner {
        max-width: 1200px;
        margin: 0 auto;
      }
      .shell-pill {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 4px 14px;
        border-radius: 9999px;
        background: rgba(255,255,255,0.18);
        border: 1px solid rgba(255,255,255,0.25);
        font-size: 12px;
        font-weight: 700;
        color: #ffffff;
        margin-bottom: 14px;
      }
      .shell-title {
        font-size: 32px;
        font-weight: 900;
        line-height: 1.15;
        color: #ffffff;
        margin: 0 0 14px;
      }
      @media (min-width: 640px) {
        .shell-title { font-size: 52px; }
      }
      .shell-subtitle {
        font-size: 14px;
        line-height: 1.5;
        color: #e2e8f0;
        max-width: 540px;
        margin: 0 0 24px;
      }
      .shell-search {
        background: rgba(255,255,255,0.96);
        border-radius: 24px;
        padding: 16px;
        max-width: 860px;
        min-height: 76px;
        box-shadow: 0 20px 35px -10px rgba(0,0,0,0.3);
      }
    </style>

    <!-- Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "WebSite",
          "@id": "https://driverent.in/#website",
          "url": "https://driverent.in/",
          "name": "DriveRent",
          "description": "Premium Car & Bike Rental Marketplace",
          "potentialAction": {
            "@type": "SearchAction",
            "target": "https://driverent.in/cars?search={search_term_string}",
            "query-input": "required name=search_term_string"
          }
        },
        {
          "@type": "Organization",
          "@id": "https://driverent.in/#organization",
          "name": "DriveRent",
          "url": "https://driverent.in/",
          "contactPoint": {
            "@type": "ContactPoint",
            "telephone": "+91-9876543210",
            "contactType": "customer service",
            "areaServed": "IN"
          }
        }
      ]
    }
    </script>
  </head>

  <body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 antialiased selection:bg-blue-600 selection:text-white">
    <div id="root">
      <div id="initial-shell" aria-hidden="true">
        <header class="shell-header">
          <div class="shell-logo">
            <div class="shell-logo-badge">
              <svg width="22" height="22" fill="#fff" viewBox="0 0 24 24">
                <path d="M18.92 6.01C18.72 5.42 18.16 5 17.5 5h-11c-.66 0-1.22.42-1.42 1.01L3 12v8c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1h12v1c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-8l-2.08-5.99zM6.85 7h10.29l1.04 3H5.81l1.04-3zM19 17H5v-4.66l.12-.34h13.77l.11.34V17z"/>
                <circle cx="7.5" cy="14.5" r="1.5"/>
                <circle cx="16.5" cy="14.5" r="1.5"/>
              </svg>
            </div>
            <span>Drive<span style="color:#2563eb">Rent</span></span>
          </div>
          <div style="display:flex;align-items:center;gap:8px;">
            <div style="width:36px;height:36px;border-radius:12px;background:#f1f5f9;border:1px solid #e2e8f0;"></div>
            <div style="width:36px;height:36px;border-radius:12px;background:#f1f5f9;border:1px solid #e2e8f0;"></div>
          </div>
        </header>

        <section class="shell-hero">
          <div style="position:absolute;inset:0;z-index:0;overflow:hidden;">
            <picture>
              <source media="(max-width: 640px)" srcset="/luxury-car-auth-mobile.webp" type="image/webp" />
              <source srcset="/luxury-car-auth.webp" type="image/webp" />
              <img
                src="/luxury-car-auth-mobile.webp"
                alt="Luxury car driving on highway"
                loading="eager"
                fetchpriority="high"
                decoding="sync"
                style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;filter:brightness(0.88);"
              />
            </picture>
            <div style="position:absolute;inset:0;background:linear-gradient(to bottom, rgba(0,0,0,0.90), rgba(0,0,0,0.70) 50%, #0b0f19 100%);pointer-events:none;"></div>
          </div>
          <div class="shell-hero-inner" style="position:relative;z-index:1;">
            <div class="shell-pill">
              <span style="width:8px;height:8px;border-radius:50%;background:#34d399;display:inline-block;"></span>
              <span>DriveRent • Find Your Perfect Ride</span>
            </div>
            <h1 class="shell-title">
              Find the Perfect Car <br /><span style="color:#60a5fa;">for Your Next Journey</span>
            </h1>
            <p class="shell-subtitle">
              Explore cars and bikes available for rent near you. Compare verified local shops and book with confidence.
            </p>
            <div class="shell-search"></div>
          </div>
        </section>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
